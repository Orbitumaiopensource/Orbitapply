name: 🐛 Bug Report
description: Something isn't working as expected
title: "bug: [short description]"
labels: ["bug"]
body:
  - type: dropdown
    id: agent
    attributes:
      label: Which agent is affected?
      options:
        - SCOUT (job discovery)
        - RECON (company intel)
        - TAILOR (resume/cover letter)
        - GUARDIAN (safety layer)
        - LEDGER (pipeline tracker)
        - COACH (interview prep)
        - SUBMIT (auto-submit)
        - ORBI (orchestrator)
        - UI / Dashboard
        - Setup / Installation
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: Describe the bug clearly...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste from logs/app.log or logs/run.log
      render: shell

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. Windows 11, macOS 14, Ubuntu 22
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: Run `node --version` and paste here
    validations:
      required: true
