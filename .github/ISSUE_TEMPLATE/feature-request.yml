name: 💡 Feature Request
description: Suggest a new feature or improvement
title: "feat: [short description]"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: e.g. I have to manually check follow-up dates...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      placeholder: Describe your idea...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      options:
        - SCOUT (job discovery)
        - RECON (company intel)
        - TAILOR (documents)
        - GUARDIAN (safety)
        - COACH (interview prep)
        - SUBMIT (auto-submit)
        - UI / Dashboard
        - Search providers
        - Job sites config
        - Setup / Installation
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would significantly improve my workflow
        - Blocking me from using OrbitApply
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Any additional context?
      placeholder: Screenshots, examples, related issues...
